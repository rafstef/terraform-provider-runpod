# Runs the unit test suite (go vet + go test) on every pull request and on
# pushes to main. Acceptance tests are gated behind TF_ACC (unset here), so this
# job runs only the unit lane — no live RunPod API or riab access required.
name: test
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0
      -
        name: Set up Go
        uses: actions/setup-go@6edd4406fa81c3da01a34fa6f6343087c207a568 # v3.5.0
        with:
          go-version-file: 'go.mod'
          cache: true
      -
        name: Vet
        run: go vet ./...
      -
        name: Unit tests
        run: go test -race ./...
